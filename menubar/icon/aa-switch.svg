<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3EC"/>
      <stop offset="1" stop-color="#C9D6FF"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFC94D"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ED6C2"/>
      <stop offset="1" stop-color="#7CC8F0"/>
    </linearGradient>
  </defs>
  <!-- 底：macOS 圆角方块 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- 小星星装饰 -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M230 260 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/>
    <path d="M790 240 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z"/>
    <path d="M760 760 l12 28 28 12 -28 12 -12 28 -12 -28 -28 -12 28 -12z"/>
    <circle cx="300" cy="740" r="9"/>
    <circle cx="700" cy="310" r="7"/>
  </g>
  <!-- 开关轨道阴影 -->
  <rect x="212" y="392" width="600" height="300" rx="150" fill="#6F7FC9" opacity="0.25"/>
  <!-- 开关轨道 -->
  <rect x="212" y="372" width="600" height="300" rx="150" fill="url(#track)"/>
  <rect x="232" y="392" width="560" height="120" rx="60" fill="#FFFFFF" opacity="0.22"/>
  <!-- 轨道上的 AA -->
  <text x="372" y="566" font-family="Arial Rounded MT Bold, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="150" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">AA</text>
  <!-- 按钮阴影 -->
  <circle cx="662" cy="536" r="126" fill="#4E6FB5" opacity="0.28"/>
  <!-- 按钮（笑脸） -->
  <circle cx="662" cy="522" r="126" fill="url(#knob)"/>
  <circle cx="662" cy="522" r="126" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.9"/>
  <ellipse cx="612" cy="470" rx="34" ry="18" fill="#FFFFFF" opacity="0.45"/>
  <!-- 眼睛 -->
  <circle cx="622" cy="512" r="15" fill="#3A2E2A"/>
  <circle cx="702" cy="512" r="15" fill="#3A2E2A"/>
  <circle cx="628" cy="506" r="5" fill="#FFFFFF"/>
  <circle cx="708" cy="506" r="5" fill="#FFFFFF"/>
  <!-- 腮红 -->
  <ellipse cx="594" cy="556" rx="24" ry="14" fill="#FF8FA3" opacity="0.75"/>
  <ellipse cx="730" cy="556" rx="24" ry="14" fill="#FF8FA3" opacity="0.75"/>
  <!-- 微笑 -->
  <path d="M632 556 q30 34 60 0" fill="none" stroke="#3A2E2A" stroke-width="10" stroke-linecap="round"/>
</svg>
