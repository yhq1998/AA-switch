name: windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish aaswitch.exe
        run: dotnet publish src/AASwitch.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -o out
      - name: Smoke run
        run: |
          ./out/aaswitch.exe version
          ./out/aaswitch.exe claude status
      # 端到端：真的 Claude Code + 本机假网关 + 真的凭据管理器，见 windows/e2e/claude-e2e.mjs
      - name: Install Claude Code and Codex CLI
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: End-to-end (Claude Code)
        run: node e2e/claude-e2e.mjs out/aaswitch.exe
      - name: Probe
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaswitch-windows-x64
          path: |
            windows/out/aaswitch.exe
            windows/probe.ps1
            windows/aa-switch-probe.txt
