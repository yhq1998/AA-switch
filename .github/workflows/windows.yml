name: windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish aaswitch.exe
        run: dotnet publish src/AASwitch.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
      - name: Smoke run
        run: |
          ./out/aaswitch.exe version
          ./out/aaswitch.exe claude status
          ./out/aaswitch.exe codex status
      # 端到端：真的 Claude Code / codex 命令行 + 本机假网关 + 真的凭据管理器，见 windows/e2e/
      - name: Install Claude Code and Codex CLI
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: End-to-end (Claude Code)
        run: node e2e/claude-e2e.mjs out/aaswitch.exe
      - name: End-to-end (Codex)
        run: node e2e/codex-e2e.mjs out/aaswitch.exe
      # 托盘程序：编译、把界面画成 PNG（菜单 / 配置表单 / 初始设置），再真的启动一次看它活着、写了日志，顺便截一张屏
      - name: Publish tray app
        run: dotnet publish src/AASwitch.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-tray
      - name: Tray click path (Claude Code)
        run: |
          "http://127.0.0.1:9`n`nsk-ui-test" | ./out/aaswitch.exe claude configure
          foreach ($want in 'api', 'account') {
            $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--click', 'claude', $want -Wait -PassThru
            $mode = ./out/aaswitch.exe claude mode
            Write-Host "click $want -> exit $($p.ExitCode), mode $mode"
            if ($p.ExitCode -ne 0 -or $mode -ne $want) { Get-Content "$env:LOCALAPPDATA\AA Switch\aa-switch.log"; exit 1 }
          }
          ./out/aaswitch.exe claude api   # 留在 API 模式，让后面的截图里有一组是 API 状态
      # 应用内更新：再编一个版本号更高的，本机起一个“官网”，让刚才那个版本自己更新自己
      - name: Self-update end-to-end
        run: |
          dotnet publish src/AASwitch.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=9.9.9 -o out-tray-new
          node e2e/update-e2e.mjs "out-tray/AA Switch.exe" "out-tray-new/AA Switch.exe" 9.9.9
      - name: Render UI to PNG
        run: |
          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--render', "$PWD\shots" -Wait -PassThru -RedirectStandardOutput render.log -RedirectStandardError render.err
          Get-Content render.log, render.err
          if ($p.ExitCode -ne 0) { exit 1 }
          # README 用的截图：固定的演示数据，不带这台机器上的测试地址
          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--render', "$PWD\shots\demo", '--demo' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      # 用户视角走一遍：下载的 exe 双击 → 提议安装 → 装好 → 从安装位置打开（弹窗口）→ 再打开一次（让正在运行的那个弹窗口）→ 卸载
      - name: Install, launch, reopen, uninstall
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$PWD\shots\$name.png")
            } catch { Write-Host "screen capture failed: $_" }
          }
          function Fail($msg) { Write-Error $msg; Get-Content $log; exit 1 }
          $data = "$env:LOCALAPPDATA\AA Switch"
          $log = "$data\aa-switch.log"
          New-Item -ItemType Directory -Force $data | Out-Null
          Add-Content "$data\settings.conf" "onboarding_done=1"   # 初始设置对话框前面的 --click 步骤已经触发过条件，这里跳过它，好看到窗口
          $exe = "$env:LOCALAPPDATA\Programs\AA Switch\AA Switch.exe"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AA Switch.lnk"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AASwitch"

          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -PassThru
          Start-Sleep -Seconds 8
          Shot "install-offer"
          if ($p.HasExited) { Fail "offer: exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--install' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "install exited with $($p.ExitCode)" }
          foreach ($path in $exe, $lnk, $key) { if (-not (Test-Path $path)) { Fail "missing after install: $path" } }
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List

          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Fail "tray app exited with $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "显示窗口" -Quiet)) { Fail "window not shown" }
          Shot "window"

          $q = Start-Process -FilePath $exe -PassThru -Wait
          Start-Sleep -Seconds 2
          if (-not (Select-String -Path $log -Pattern "另一份程序被打开" -Quiet)) { Fail "second launch did not reveal the running one" }
          if ($p.HasExited) { Fail "first instance exited" }
          Shot "reopen"

          Start-Process -FilePath $exe -ArgumentList '--uninstall', '--quiet' -Wait
          Start-Sleep -Seconds 6
          foreach ($path in $lnk, $key, $exe) { if (Test-Path $path) { Fail "still there after uninstall: $path" } }
          Get-Content $log
      - name: Probe
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaswitch-windows-x64
          path: |
            windows/out/aaswitch.exe
            windows/out-tray/AA Switch.exe
      # 截图和探测结果单独一个小包，取回来看不用下载几十 MB 的 exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            windows/shots/
            windows/aa-switch-probe.txt
