name: windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish aaswitch.exe
        run: dotnet publish src/AASwitch.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
      - name: Smoke run
        run: |
          ./out/aaswitch.exe version
          ./out/aaswitch.exe claude status
          ./out/aaswitch.exe codex status
      # 端到端：真的 Claude Code / codex 命令行 + 本机假网关 + 真的凭据管理器，见 windows/e2e/
      - name: Install Claude Code and Codex CLI
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: End-to-end (Claude Code)
        run: node e2e/claude-e2e.mjs out/aaswitch.exe
      - name: End-to-end (Codex)
        run: node e2e/codex-e2e.mjs out/aaswitch.exe
      # 托盘程序：编译、把界面画成 PNG（菜单 / 配置表单 / 初始设置），再真的启动一次看它活着、写了日志，顺便截一张屏
      - name: Publish tray app
        run: dotnet publish src/AASwitch.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-tray
      - name: Tray click path (Claude Code)
        run: |
          "http://127.0.0.1:9`n`nsk-ui-test" | ./out/aaswitch.exe claude configure
          foreach ($want in 'api', 'account') {
            $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--click', 'claude', $want -Wait -PassThru
            $mode = ./out/aaswitch.exe claude mode
            Write-Host "click $want -> exit $($p.ExitCode), mode $mode"
            if ($p.ExitCode -ne 0 -or $mode -ne $want) { Get-Content "$env:LOCALAPPDATA\AA Switch\aa-switch.log"; exit 1 }
          }
          ./out/aaswitch.exe claude api   # 留在 API 模式，让后面的截图里有一组是 API 状态
      - name: Render UI to PNG
        run: |
          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -ArgumentList '--render', "$PWD\shots" -Wait -PassThru -RedirectStandardOutput render.log -RedirectStandardError render.err
          Get-Content render.log, render.err
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Launch tray app for real
        run: |
          $p = Start-Process -FilePath "out-tray/AA Switch.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "tray app exited with $($p.ExitCode)"; exit 1 }
          Get-Content "$env:LOCALAPPDATA\AA Switch\aa-switch.log"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\shots\screen.png")
          } catch { Write-Host "screen capture failed: $_" }
          Stop-Process -Id $p.Id -Force
      - name: Probe
        if: always()
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaswitch-windows-x64
          path: |
            windows/out/aaswitch.exe
            windows/out-tray/AA Switch.exe
      # 截图和探测结果单独一个小包，取回来看不用下载几十 MB 的 exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            windows/shots/
            windows/aa-switch-probe.txt
